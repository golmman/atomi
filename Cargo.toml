[package]
name = "atomi"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Attacker-only atomic chess win prover"

[dependencies]
atomic-movegen = "2.4"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 3
